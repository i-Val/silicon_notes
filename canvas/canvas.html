<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Notes Canvas - Rich Web Sticky Notes</title>
  <link rel="icon" type="image/png" href="../icons/icon32.png">
  <style>
    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('Poppins'), local('Poppins Regular'), url('../fonts/poppins-400.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 500;
      font-display: swap;
      src: local('Poppins Medium'), url('../fonts/poppins-500.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: local('Poppins SemiBold'), url('../fonts/poppins-600.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: local('Poppins Bold'), url('../fonts/poppins-700.woff2') format('woff2');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: italic;
      font-weight: 400;
      font-display: swap;
      src: local('Poppins Italic'), url('../fonts/poppins-italic.woff2') format('woff2');
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      user-select: none;
    }

    /* Top Floating Toolbar */
    .canvas-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-right: 12px;
      border-right: 1px solid #e2e8f0;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 13.5px;
      color: #0f172a;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      border-radius: 999px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background-color: #18181b;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #27272a;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #ffffff;
      color: #475569;
      border-color: #cbd5e1;
    }

    .btn-secondary:hover {
      background-color: #f1f5f9;
      color: #0f172a;
    }

    .shortcut-badge {
      font-size: 11px;
      color: #64748b;
      margin-left: 4px;
    }

    .shortcut-badge kbd {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 1px 4px;
      font-weight: 600;
      color: #334155;
    }

    /* Watermark center instructions */
    .canvas-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      color: #94a3b8;
      z-index: 1;
    }

    .canvas-hint h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #64748b;
    }

    .canvas-hint p {
      font-size: 13px;
    }
  </style>
</head>
<body>
  <!-- Floating Top Bar -->
  <div class="canvas-bar">
    <div class="brand-section">
      <img src="../icons/icon32.png" alt="Logo" class="brand-icon">
      <span class="brand-title">Notes Canvas</span>
    </div>

    <button class="btn btn-primary" id="btnCanvasNewNote">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span>New Sticky Note</span>
    </button>

    <div class="shortcut-badge">
      Press <kbd id="shortcutHint">Alt+Shift+N</kbd>
    </div>
  </div>

  <div class="canvas-hint" id="canvasHint">
    <h2>Blank Notes Workspace</h2>
    <p>Click "New Sticky Note" or press Alt+Shift+N to create a note anywhere on this canvas.</p>
  </div>

  <script src="../content/content.js"></script>
  <script>
    // Canvas page integration
    const isMac = navigator.userAgent.toLowerCase().includes('mac');
    const shortcutHint = document.getElementById('shortcutHint');
    if (shortcutHint && isMac) {
      shortcutHint.textContent = 'Cmd+Shift+N';
    }

    const btnNew = document.getElementById('btnCanvasNewNote');
    btnNew.addEventListener('click', () => {
      window.postMessage({ type: 'CANVAS_CREATE_NOTE' }, '*');
    });

    // Support opening a specific note directly on canvas from query param
    const urlParams = new URLSearchParams(window.location.search);
    const targetNoteId = urlParams.get('openNoteId');
    if (targetNoteId) {
      setTimeout(() => {
        window.postMessage({ type: 'CANVAS_OPEN_ONLY_NOTE', noteId: targetNoteId }, '*');
      }, 150);
    }

    // Check if any notes exist to hide watermark hint
    function checkHint() {
      const hint = document.getElementById('canvasHint');
      const root = document.getElementById('rich-web-sticky-notes-root');
      if (root && root.shadowRoot) {
        const notes = root.shadowRoot.querySelectorAll('.sticky-note');
        if (hint) {
          hint.style.display = notes.length > 0 ? 'none' : 'block';
        }
      }
    }
    setInterval(checkHint, 500);
  </script>
</body>
</html>
