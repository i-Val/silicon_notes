<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rich Web Sticky Notes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-wrapper">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="../icons/icon32.png" alt="App Logo" class="brand-icon">
        <div class="brand-text">
          <div class="brand-title">Rich Sticky Notes</div>
          <div class="page-url" id="pageUrl" title="Current Page URL">Loading page...</div>
        </div>
      </div>
      <div class="header-badges">
        <span class="badge" id="notesCountBadge">0 notes</span>
      </div>
    </header>

    <!-- Top Action Bar -->
    <div class="action-bar">
      <button class="btn btn-primary" id="btnNewNote">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>New Note</span>
      </button>

      <div class="action-bar-right">
        <button class="btn-icon" id="btnToggleVisibility" title="Toggle Show/Hide Notes">
          <svg id="iconEye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>

        <button class="btn-icon" id="btnExport" title="Export Notes (Markdown)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </button>

        <button class="btn-icon btn-danger-icon" id="btnClearAll" title="Delete All Notes on this Page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Input -->
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search notes on this page...">
      <button class="search-clear" id="searchClear" title="Clear search">&times;</button>
    </div>

    <!-- Notes List Section -->
    <main class="notes-container" id="notesList">
      <!-- Notes cards or empty state inserted dynamically -->
    </main>

    <!-- Footer Shortcuts Info -->
    <footer class="popup-footer">
      <div class="shortcut-tip">
        <kbd id="newKeyHint">Alt+Shift+N</kbd> New note &bull; <kbd id="toggleKeyHint">Alt+Shift+H</kbd> Toggle
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
