<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="yellow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="fold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Sticky Note Body with Shadow -->
  <path d="M 16 16 L 112 16 L 112 84 L 84 112 L 16 112 Z" 
        fill="url(#yellow-grad)" 
        stroke="#eab308" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#drop-shadow)" />

  <!-- Header Strip -->
  <path d="M 16 16 L 112 16 L 112 42 L 16 42 Z" 
        fill="url(#header-grad)" 
        stroke="#eab308" 
        stroke-width="1.5" />

  <!-- Grip Dots in Header -->
  <circle cx="28" cy="29" r="2" fill="#854d0e" opacity="0.6"/>
  <circle cx="36" cy="29" r="2" fill="#854d0e" opacity="0.6"/>
  <circle cx="44" cy="29" r="2" fill="#854d0e" opacity="0.6"/>
  <circle cx="28" cy="35" r="2" fill="#854d0e" opacity="0.6"/>
  <circle cx="36" cy="35" r="2" fill="#854d0e" opacity="0.6"/>
  <circle cx="44" cy="35" r="2" fill="#854d0e" opacity="0.6"/>

  <!-- Folded Corner Shadow & Flap -->
  <path d="M 112 84 L 84 112 L 84 84 Z" fill="#ca8a04" opacity="0.45"/>
  <path d="M 112 84 L 84 112 L 84 84 Z" fill="url(#fold-grad)" stroke="#eab308" stroke-width="2" stroke-linejoin="round"/>

  <!-- Content lines -->
  <rect x="28" y="54" width="60" height="4.5" rx="2.25" fill="#18181b" opacity="0.85"/>
  <rect x="28" y="68" width="50" height="4" rx="2" fill="#18181b" opacity="0.65"/>
  <rect x="28" y="80" width="40" height="4" rx="2" fill="#18181b" opacity="0.65"/>
  <rect x="28" y="92" width="30" height="4" rx="2" fill="#18181b" opacity="0.65"/>
</svg>
